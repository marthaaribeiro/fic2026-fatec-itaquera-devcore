name: Build and deploy Node.js app to Azure Web App - frontend-ong

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  APP_DIR: back=end/src/package.json     

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.APP_DIR }}/dist    

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CDA05480FD014A6DA856AA76B01A52F0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A1324D16458B4581A80352265377A00C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_749EB65348824CEFB03D0161A09D7D0B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'frontend-ong'
          slot-name: 'Production'
          package: .
